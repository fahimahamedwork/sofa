services:
  postgres:
    image: postgres:16-alpine
    container_name: sofa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sofa
      POSTGRES_PASSWORD: sofa
      POSTGRES_DB: sofa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sofa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sofa"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sofa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sofa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  traefik:
    image: traefik:v3
    container_name: sofa-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=sofa-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@sofa.local"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "8081:80"
      - "8443:443"
      - "8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/acme.json
    # Fix acme.json permissions on startup
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod 600 /acme.json 2>/dev/null || true
        /entrypoint.sh traefik
    networks:
      - sofa-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sofa-backend
    restart: unless-stopped
    environment:
      - SOFA_DATABASE_HOST=postgres
      - SOFA_DATABASE_PORT=5432
      - SOFA_DATABASE_USER=sofa
      - SOFA_DATABASE_PASSWORD=sofa
      - SOFA_DATABASE_DBNAME=sofa
      - SOFA_DATABASE_SSLMODE=disable
      - SOFA_REDIS_HOST=redis
      - SOFA_REDIS_PORT=6379
      - SOFA_AUTH_JWT_SECRET=sofa-production-secret-change-me
      - SOFA_AUTH_ADMIN_PASSWORD=admin
      - SOFA_DOCKER_SOCKET_PATH=/var/run/docker.sock
      - SOFA_DOCKER_NETWORK_NAME=sofa-network
      - SOFA_TRAEFIK_API_URL=http://traefik:8080
      - SOFA_TRAEFIK_BASE_DOMAIN=localhost
    ports:
      - "8000:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - build_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sofa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sofa-frontend
    restart: unless-stopped
    ports:
      - "7632:80"
    depends_on:
      - backend
    networks:
      - sofa-network

volumes:
  postgres_data:
  redis_data:
  traefik_acme:
  build_cache:

networks:
  sofa-network:
    driver: bridge
